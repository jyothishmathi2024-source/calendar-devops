
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendar-v1
  template:
    metadata:
      labels:
        app: calendar-v1
    spec:
      containers:
        - name: calendar-app
          image: jyothishmathi25/calendar-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
